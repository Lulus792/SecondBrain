name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ui:
    name: UI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev
      - name: Configure UI
        run: cmake -S . -B build/ui -DSB_BUILD_UI=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build UI and editor checks
        run: cmake --build build/ui --config Debug --parallel 4
      - name: Verify UI on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build/ui -C Debug --output-on-failure
      - name: Verify UI on Windows and macOS
        if: runner.os != 'Linux'
        run: ctest --test-dir build/ui -C Debug --output-on-failure
  native-core:
    name: C17 / ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Configure native core
        run: cmake -S . -B build/native -DSB_BUILD_UI=OFF -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build native core and tools
        run: cmake --build build/native --config ${{ matrix.config }} --parallel
      - name: Verify native project workflow
        run: ctest --test-dir build/native -C ${{ matrix.config }} --output-on-failure
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check generator and preservation of existing content
        run: python -m unittest discover -s tests -v
