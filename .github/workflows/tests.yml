name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-core:
    name: C17 / ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Configure native core
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build native core and tools
        run: cmake --build build/native --config ${{ matrix.config }} --parallel
      - name: Verify native project workflow
        run: ctest --test-dir build/native -C ${{ matrix.config }} --output-on-failure
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check generator and preservation of existing content
        run: python -m unittest discover -s tests -v
