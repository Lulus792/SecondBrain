name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-ui:
    name: Desktop / ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libatspi2.0-dev at-spi2-core dbus-x11 libglib2.0-bin libglib2.0-dev
      - name: Configure UI
        shell: bash
        run: |
          mkdir -p build/ui
          cmake "-DSB_SOURCE_DIR=${GITHUB_WORKSPACE}" "-DSB_BUILD_DIR=${GITHUB_WORKSPACE}/build/ui" "-DSB_BUILD_CONFIG=${{ matrix.config }}" -P tools/configure_ui_checked.cmake 2>&1 | tee build/ui/configure-entry.log
      - name: Publish configure entry diagnostics
        if: failure()
        shell: bash
        run: cmake -DSB_DIAGNOSTIC_LOG=build/ui/configure-entry.log -P tools/ci_log_report.cmake
      - name: Build UI and editor checks
        run: cmake -DSB_BUILD_DIR=build/ui -DSB_BUILD_CONFIG=${{ matrix.config }} -P tools/build_checked.cmake
      - name: Verify UI on Linux
        if: runner.os == 'Linux'
        run: sh tools/run_linux_ui_tests.sh cmake -DSB_TEST_DIR=build/ui -DSB_TEST_CONFIG=${{ matrix.config }} -P tools/test_checked.cmake
      - name: Verify UI on Windows and macOS
        if: runner.os != 'Linux'
        run: python tools/test_entry.py --test-dir build/ui --config ${{ matrix.config }} --log build/ui/test-entry.log
      - name: Publish test entry diagnostics
        if: failure()
        run: python tools/ci_log_report.py --log build/ui/test-entry.log --title "UI test entry"
      - name: Publish failed test diagnostics
        if: failure()
        run: cmake -DSB_TEST_LOG=build/ui/Testing/Temporary/LastTest.log -P tools/ci_diagnostics.cmake
      - name: Create application package
        if: matrix.config == 'Release'
        run: cpack --config build/ui/CPackConfig.cmake -C Release -B build/ui/packages
      - name: Verify extracted Linux package
        if: matrix.config == 'Release' && runner.os == 'Linux'
        run: xvfb-run -a cmake -DSB_ARCHIVE_ROOT=build/ui/packages -DSB_TEST_ROOT=build/ui/package-check -P tests/test_package.cmake
      - name: Verify extracted Windows and macOS package
        if: matrix.config == 'Release' && runner.os != 'Linux'
        run: cmake -DSB_ARCHIVE_ROOT=build/ui/packages -DSB_TEST_ROOT=build/ui/package-check -P tests/test_package.cmake
      - uses: actions/upload-artifact@v7
        if: matrix.config == 'Release'
        with:
          name: SecondBrain-${{ runner.os }}-${{ runner.arch }}
          path: build/ui/packages/SecondBrain-*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Desktop-evidence-${{ runner.os }}-${{ matrix.config }}
          path: |
            build/ui/Testing/Temporary/LastTest.log
            build/ui/checked-ctest.log
            build/ui/test-entry.log
            build/ui/checked-configure.log
            build/ui/configure-entry.log
            build/ui/accesskit-windows-build/**/*.log
            build/ui/sb_accesskit_windows_build-prefix/**/*.log
            build/ui/system-style-data/**/*.bmp
            build/ui/welcome-data/**/*.bmp
            build/ui/project-errors-data/**/*.bmp
            build/ui/ui-test.bmp
            build/ui/own-project.bmp
            build/ui/desktop-data/**/*.bmp
            build/ui/keyboard-data/**/*.bmp
            build/ui/package-check/**/*.bmp
            build/ui/preferences-data/**/*.bmp
            build/ui/process-preferences/**/*.bmp
            build/ui/backup-ui-data/**/*.bmp
          retention-days: 30
  native-core:
    name: C17 / ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Configure native core
        run: cmake -S . -B build/native -DSB_BUILD_UI=OFF -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build native core and tools
        run: cmake --build build/native --config ${{ matrix.config }} --parallel
      - name: Verify native project workflow
        run: python tools/test_entry.py --test-dir build/native --config ${{ matrix.config }} --log build/native/test-entry.log
      - name: Publish core test entry diagnostics
        if: failure()
        run: python tools/ci_log_report.py --log build/native/test-entry.log --title "Core test entry"
      - name: Publish failed core test diagnostics
        if: failure()
        run: cmake -DSB_TEST_LOG=build/native/Testing/Temporary/LastTest.log -P tools/ci_diagnostics.cmake
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Core-evidence-${{ runner.os }}-${{ matrix.config }}
          path: |
            build/native/Testing/Temporary/LastTest.log
            build/native/checked-ctest.log
            build/native/test-entry.log
          retention-days: 30
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check generator and preservation of existing content
        run: python -m unittest discover -s tests -v
