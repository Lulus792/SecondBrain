    {id:'ui',title:'UI-Gestaltung',group:'secondbrain',pos:[390,-180,-30],body:'Gestaltung mit klarer Hierarchie, gut lesbarem Text und räumlicher Orientierung. Die Galaxie ist ein Zugang zum Wissen.'},
    {id:'core',title:'C-Kern',group:'secondbrain',pos:[120,-220,-80],body:'Projektverwaltung und Speicherung gehören zum eigenen Kern. Die Oberfläche zeigt dieselben lesbaren Projektdateien.'},
    {id:'platform',title:'Plattformtests',group:'secondbrain',pos:[410,70,90],body:'Windows, macOS und Linux haben eigene Nachweise. Ein geplantes Merkmal und ein bestandener Test werden getrennt dokumentiert.'},
    {id:'decisions',title:'Entscheidungen',group:'secondbrain',pos:[200,110,-100],body:'Wesentliche Entscheidungen erklären, warum ein Weg gewählt wurde. Ihre Gründe und Quellen bleiben zugänglich.'},
    {id:'research',title:'Recherche',group:'research',hub:true,pos:[50,210,-280],body:'Eine weitere Beispielwelt für Themen, Quellen und neue Gedanken. Kein zusätzliches Projekt wurde dafür angelegt.'},
    {id:'ideen',title:'Neue Ideen',group:'research',pos:[-90,265,-250],body:'Noch ungeordnete Gedanken können im Eingang gesammelt und später mit einem passenden Projekt verbunden werden.'},
    {id:'papers',title:'Fachliteratur',group:'research',pos:[120,345,-320],body:'Quellen und Erkenntnisse zusammenhalten. Eine sichtbare Verbindung soll einen nachvollziehbaren Zusammenhang darstellen.'}
  ];
  const edges=[['physim','energie'],['physim','integration'],['physim','experiment'],['physim','sources'],['physim','fragen'],['energie','integration'],['energie','experiment'],['integration','sources'],['secondbrain','ui'],['secondbrain','core'],['secondbrain','platform'],['secondbrain','decisions'],['ui','decisions'],['core','platform'],['research','ideen'],['research','papers'],['sources','papers'],['ui','ideen']];
  const byId=new Map(sample.map(n=>[n.id,n]));
  const renders=[];
  const saved=window.openai&&window.openai.widgetState;

  }
  root.querySelectorAll('.sb-window').forEach(function(app){

    const state={selected:'energie',project:'physim',yaw:.12,pitch:.22,zoom:1,panX:0,panY:0,stars:390,glow:.65,links:true,appearance:'Dunkel',thickness:9,frost:.18,highlight:.78};
    if(saved&&saved.modelContent&&saved.modelContent.preview&&saved.modelContent.preview.design===kind&&byId.has(saved.modelContent.preview.note))
      state.selected=saved.modelContent.preview.note;
    let width=1,height=1,palette={},hits=[],drag=null,scheduled=false,animation=0;
    const probe=document.createElement('span');probe.style.display='none';app.appendChild(probe);
    const materials=[];
    app.querySelectorAll('.sb-header,.sb-reader,.sb-camera').forEach(function(surface){

      });

    });
    function renderMaterials(){
      const cr=canvas.getBoundingClientRect(),source=ctx.getImageData(0,0,canvas.width,canvas.height),pixels=source.data;
      const scaleX=canvas.width/cr.width,scaleY=canvas.height/cr.height;

        const image=material.paint.createImageData(w,h),out=image.data;
        const hw=rect.width/2,hh=rect.height/2,radius=Math.min(parseFloat(getComputedStyle(surface).borderRadius)||24,hw,hh);
        for(let py=0;py<h;py++){
          for(let px=0;px<w;px++){
            const lx=(px+.5)/scale,ly=(py+.5)/scale,qx=Math.abs(lx-hw)-(hw-radius),qy=Math.abs(ly-hh)-(hh-radius);
            const ox=Math.max(qx,0),oy=Math.max(qy,0),len=Math.sqrt(ox*ox+oy*oy);
            const distance=len+Math.min(Math.max(qx,qy),0)-radius;

            else if(qx>qy)nx=Math.sign(lx-hw);else ny=Math.sign(ly-hh);

            out[output+2]=pixels[input+2]*(1-frost)+115*frost+255*shine;
            out[output+3]=255;

      }
    }
    function color(variable){probe.style.color='var('+variable+')';return getComputedStyle(probe).color;}
    function colors(){

    }
    function point(pos){
      let x=pos[0],y=pos[1],z=pos[2];
      if(kind==='atlas')return {x:width*.5+(x+state.panX)*width/900*state.zoom,y:height*.5+(y+state.panY)*height/710*state.zoom,k:1,z:z};
      const a=x*Math.cos(state.yaw)-z*Math.sin(state.yaw),b=x*Math.sin(state.yaw)+z*Math.cos(state.yaw);
      const c=y*Math.cos(state.pitch)-b*Math.sin(state.pitch),d=y*Math.sin(state.pitch)+b*Math.cos(state.pitch);
      const k=1000/Math.max(450,1200+d),usable=width>700?width-190:width;
      const scale=Math.min(usable/1080,height/910)*state.zoom;
      return {x:(width>700?usable*.5+20:width*.5)+(a+state.panX)*k*scale,y:height*(width<=700?.36:kind==='focus'?.39:.48)+(c+state.panY)*k*scale,k:k*scale,z:d};
    }
    function positions(){
      if(kind!=='orbit')return sample.map(n=>({node:n,p:point(n.pos)}));
      const group=sample.filter(n=>n.group===state.project),count=group.length-1;
      return group.map(function(n,i){
        if(n.hub)return {node:n,p:point([0,0,0])};
        const angle=(i-1)/Math.max(count,1)*Math.PI*2-.9,r=145+(i%3)*39;
        return {node:n,p:point([Math.cos(angle)*r,Math.sin(angle)*r*.58,Math.sin(angle)*r*.72])};
      });
    }
    function draw(){
      scheduled=false;
      if(!width||!height)return;
      ctx.clearRect(0,0,width,height);ctx.fillStyle=palette.bg;ctx.fillRect(0,0,width,height);
      if(kind!=='atlas'){
        [['physim',.3,.35],['secondbrain',.74,.3],['research',.52,.8]].forEach(function(a){
          const glow=ctx.createRadialGradient(width*a[1],height*a[2],0,width*a[1],height*a[2],width*.5);
          glow.addColorStop(0,palette[a[0]]);glow.addColorStop(1,'rgba(0,0,0,0)');
          ctx.globalAlpha=.075*state.glow;ctx.fillStyle=glow;ctx.fillRect(0,0,width,height);ctx.globalAlpha=1;
        });
      }
      for(let i=0;i<state.stars;i++){
        const fx=(Math.sin(i*127.1+41)*43758.5453)%1,fy=(Math.sin(i*311.7+29)*12658.147)%1;
        const x=(Math.abs(fx)*width+state.yaw*19*(i%3+1)+width)%width,y=(Math.abs(fy)*height+state.pitch*17+height)%height;
        ctx.globalAlpha=kind==='atlas'?.13:.14+(i%7)*.055;ctx.fillStyle=palette.ink;
        ctx.beginPath();ctx.arc(x,y,i%23===0?1.4:.6,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      }
      const projected=positions(),points=new Map(projected.map(v=>[v.node.id,v.p]));
      if(kind==='orbit'){
        ctx.strokeStyle=palette.muted;ctx.lineWidth=1;ctx.globalAlpha=.2;
        [145,184,223].forEach(function(r){
          ctx.beginPath();
          for(let a=0;a<=100;a++){const theta=a/100*Math.PI*2,p=point([Math.cos(theta)*r,Math.sin(theta)*r*.58,Math.sin(theta)*r*.72]);if(!a)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
          ctx.stroke();
        });ctx.globalAlpha=1;
      }
      if(state.links){
        edges.forEach(function(edge){
          const a=points.get(edge[0]),b=points.get(edge[1]);if(!a||!b)return;
          const active=edge.includes(state.selected);
          ctx.strokeStyle=active?palette[byId.get(state.selected).group]:palette.muted;ctx.globalAlpha=active?.58:kind==='focus'?.055:.18;ctx.lineWidth=active?1.4:1;
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1;
        });
      }
      hits=[];const query=search.value.trim().toLocaleLowerCase();
      projected.sort((a,b)=>b.p.z-a.p.z).forEach(function(v){
        const n=v.node,p=v.p,active=n.id===state.selected,neighbor=active||edges.some(e=>e.includes(state.selected)&&e.includes(n.id)),match=(!query||n.title.toLocaleLowerCase().includes(query))&&(kind!=='focus'||neighbor);
        if(p.x<0||p.x>width||p.y<0||p.y>height)return;
        const r=kind==='orbit'?(n.hub?24:8+(sample.indexOf(n)%3)*3)*Math.max(.5,p.k):n.hub?7:active?5:3.3;
        ctx.globalAlpha=match?1:.15;ctx.shadowColor=palette[n.group];ctx.shadowBlur=(kind==='atlas'?3:active?26:n.hub?20:10)*state.glow;
        if(kind==='orbit'){
          const gradient=ctx.createRadialGradient(p.x-r*.3,p.y-r*.35,0,p.x,p.y,r);
          gradient.addColorStop(0,palette.ink);gradient.addColorStop(.35,palette[n.group]);gradient.addColorStop(1,palette.bg);ctx.fillStyle=gradient;
        }else ctx.fillStyle=active?palette.ink:palette[n.group];
        ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
        if(active){ctx.strokeStyle=palette[n.group];ctx.globalAlpha=.65;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,r+7,0,Math.PI*2);ctx.stroke();}
        ctx.globalAlpha=1;hits.push({id:n.id,x:p.x,y:p.y,r:Math.max(18,r+8),node:n});
      });
      const occupied=[];
      projected.sort((a,b)=>(b.node.id===state.selected?10:b.node.hub?5:0)-(a.node.id===state.selected?10:a.node.hub?5:0)).forEach(function(v){
        const n=v.node,p=v.p,active=n.id===state.selected;
        if(query&&!n.title.toLocaleLowerCase().includes(query))return;
        if(kind==='focus'&&n.id!==state.selected&&!edges.some(e=>e.includes(state.selected)&&e.includes(n.id)))return;
        if(width<400&&!active&&!n.hub)return;
        const label=n.short||n.title;ctx.font=(n.hub?'500 ':'400 ')+(n.hub?'14':'12')+'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
        const w=ctx.measureText(label).width,x=Math.max(12,Math.min(width-w-12,p.x+13)),y=p.y-10;
        const box={x:x,y:y-14,w:w+12,h:20};
        if(y<110||y>height-70||occupied.some(b=>box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y))return;
        if(kind!=='atlas'&&reader&&!reader.hidden){
          const cr=canvas.getBoundingClientRect(),rr=reader.getBoundingClientRect();

      });

    }
    function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(draw);}}
    function resize(){
      const rect=canvas.getBoundingClientRect();if(rect.width<1||rect.height<1)return;
      width=rect.width;height=rect.height;const ratio=Math.min(2,window.devicePixelRatio||1);

    }
    function content(){
      const n=byId.get(state.selected);app.querySelector('.sb-note-title').textContent=n.title;
      app.querySelector('.sb-note-body').textContent=n.body;
      app.querySelector('.sb-selection').textContent=n.title;
      app.querySelector('.sb-world-title').textContent=byId.get(state.project).title;
      const neighbors=app.querySelector('.sb-neighbors');neighbors.replaceChildren();
      edges.filter(e=>e.includes(n.id)).slice(0,3).forEach(function(e){
        const id=e[0]===n.id?e[1]:e[0],b=document.createElement('button');
        b.type='button';b.className='cursor-interaction';b.textContent=byId.get(id).short||byId.get(id).title;b.addEventListener('click',()=>choose(id,false));neighbors.appendChild(b);
      });

      app.querySelectorAll('.sb-mini-card').forEach(function(card,i){
        const other=byId.get(related[i]);card.hidden=!other;if(!other)return;
        card.dataset.node=other.id;card.querySelector('span').textContent='VERBINDUNG';
        card.querySelector('strong').textContent=other.title;
        card.querySelector('small').textContent=byId.get(other.group).title+(other.hub?' · Projekt':' · Notiz');
      });
    }
    function choose(id,focus){
      if(!byId.has(id))return;state.selected=id;state.project=byId.get(id).group;select.value=state.project;
      if(kind==='orbit'){state.project=byId.get(id).group;select.value=state.project;}
      reader.hidden=false;const cards=app.querySelector('.sb-related-cards');if(cards)cards.hidden=false;
      content();if(focus)focusNode();schedule();remember(kind,state);
    }
    function focusNode(){
      cancelAnimationFrame(animation);
      const n=byId.get(state.selected),pos=kind==='orbit'?[0,0,0]:n.pos;
      const endX=kind==='atlas'?-pos[0]:-(pos[0]*Math.cos(state.yaw)-pos[2]*Math.sin(state.yaw));
      const endY=kind==='atlas'?-pos[1]:-(pos[1]*Math.cos(state.pitch));

      }animation=requestAnimationFrame(move);
    }
    canvas.addEventListener('pointerdown',function(e){cancelAnimationFrame(animation);drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,shift:e.shiftKey,moved:false};canvas.setPointerCapture(e.pointerId);});

      if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;

    });});

    app.querySelector('.sb-close').addEventListener('click',function(){reader.hidden=true;const cards=app.querySelector('.sb-related-cards');if(cards)cards.hidden=true;app.querySelector('.sb-selection').textContent='Wähle einen Stern';schedule();});
    app.querySelectorAll('[data-node]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.node,false)));
    select.addEventListener('change',function(){state.project=select.value;choose(select.value,kind!=='orbit');});
    search.addEventListener('input',schedule);
    function redesign(){

      app.style.setProperty('--lg-edge-strength',state.highlight);

    }
    content();if(reader.hidden)app.querySelector('.sb-selection').textContent='Wähle einen Stern';
    new ResizeObserver(resize).observe(canvas);resize();renders.push(redesign);
    if(globalThis.Tweak){
      const tweak=new Tweak({container:app,onChange:redesign});
      tweak.addSlider(state,'stars',{label:'Sternendichte',min:40,max:850,step:10});
      tweak.addSlider(state,'glow',{label:'Leuchten',min:.15,max:1.6,step:.05});
      tweak.addToggle(state,'links',{label:'Verbindungen anzeigen'});
      tweak.addSlider(state,'thickness',{label:'Linsenwirkung',min:2,max:15,step:1});
      tweak.addSlider(state,'frost',{label:'Trübung',min:.05,max:.4,step:.025});
      tweak.addSlider(state,'highlight',{label:'Lichtkanten',min:.25,max:1,step:.05});
    }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>renders.forEach(f=>f()));
})();
